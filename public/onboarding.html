<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Onboarding — Personal Reserve</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .onboard-shell { max-width: 560px; margin: 48px auto; padding: 1rem; }
      .onboard-card { background: var(--card); border: 1px solid var(--stroke); border-radius: 16px; padding: 1rem; }
      .onboard-actions { display:flex; gap:0.5rem; justify-content:flex-end; margin-top:0.8rem }
      .cancel { background: transparent; border-radius: 12px; padding:0.6rem 0.8rem }
    </style>
  </head>
  <body>
    <div class="onboard-shell">
      <div class="onboard-card">
        <h2>Onboarding</h2>
        <p class="eyebrow">A few quick details to personalize your experience</p>
        <form id="onboardForm" class="onboarding-form">
          <label>
            Full name
            <input id="name" name="name" type="text" placeholder="Your legal name" required />
          </label>
          <label>
            Email
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </label>
          <label>
            Monthly income
            <input id="income" name="income" type="number" min="0" step="0.01" />
          </label>
          <label>
            Risk profile
            <select id="riskProfile" name="riskProfile">
              <option value="conservative">Conservative</option>
              <option value="moderate" selected>Moderate</option>
              <option value="aggressive">Aggressive</option>
            </select>
          </label>
          <label class="check-row">
            <input id="kyc" name="kyc" type="checkbox" />
            <span>KYC documents verified</span>
          </label>

          <div class="onboard-actions">
            <button id="cancelBtn" type="button" class="cancel">Cancel</button>
            <button id="saveBtn" type="submit" class="primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      async function loadExisting() {
        const resp = await fetch('/api/onboarding');
        if (!resp.ok) return;
        const data = await resp.json();
        if (!data.ok) return;
        const o = data.onboarding || {};
        document.getElementById('name').value = o.name || '';
        document.getElementById('email').value = o.email || '';
        document.getElementById('income').value = o.income || 0;
        document.getElementById('riskProfile').value = o.riskProfile || 'moderate';
        document.getElementById('kyc').checked = !!o.kycVerified;
      }

      document.getElementById('onboardForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          income: Number(document.getElementById('income').value || 0),
          riskProfile: document.getElementById('riskProfile').value,
          kycVerified: document.getElementById('kyc').checked,
          onboardingComplete: true,
        };
        const res = await fetch('/api/onboarding', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        const body = await res.json();
        if (!res.ok || !body.ok) {
          alert(body.error || 'Unable to save onboarding');
          return;
        }
        // after successful save, return to app
        window.location.href = '/';
      });

      document.getElementById('cancelBtn').addEventListener('click', () => {
        window.location.href = '/';
      });

      loadExisting();
    </script>
  </body>
</html>
